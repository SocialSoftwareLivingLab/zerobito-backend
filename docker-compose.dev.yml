services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: zerobito-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: zerobito
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - zerobito-dev

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: zerobito-backend-dev
    volumes:
      - ./src:/app/src
      - node_modules:/app/node_modules
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - zerobito-dev

networks:
  zerobito-dev:
    driver: bridge

volumes:
  pgdata_dev:
  node_modules:
