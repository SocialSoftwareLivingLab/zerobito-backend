name: Build, Push e Deploy - Zerobito Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1️⃣ Checkout do código
      - name: Checkout do repositório
        uses: actions/checkout@v3

      # 2️⃣ Login no GitHub Container Registry
      - name: Login no GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Definir nome da imagem
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=$OWNER" >> $GITHUB_ENV

      - name: Build da imagem
        run: |
          docker build -t ghcr.io/$OWNER/zerobito-backend:latest .

      - name: Push da imagem
        run: |
          docker push ghcr.io/$OWNER/zerobito-backend:latest

      # 5️⃣ Deploy na VM
      - name: Deploy na VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_VM }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/apps/backend

            echo "Baixando nova imagem..."
            sudo docker compose pull

            echo "Subindo containers..."
            sudo docker compose up -d

            echo "Limpando imagens antigas..."
            sudo docker image prune -f

            echo "Deploy finalizado com sucesso!"