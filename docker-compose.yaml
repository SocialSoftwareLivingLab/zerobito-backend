version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: zerobito
    ports:
      - "5432:5432"
    volumes:
      - my_dbdata:/var/lib/postgresql/data
    networks:
      - zerobito-network

  backend:
    image: zerobito-backend:0.5.1
    container_name: zerobito-backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - zerobito-network
    restart: unless-stopped

networks:
  zerobito-network:
    driver: bridge

volumes:
  my_dbdata:
